<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Pildikaart - Töölaud</title>
    <link rel="stylesheet" href="mapareastyle.css">
</head>
<body>

<header>
    <h1>Map area kasutamine</h1>
    <p>Palun tee klõps hiirega pildi peal!</p>
</header>

<main>

    <img src="töölaud.jpg" alt="arvuti pilt" usemap="#arvutipilt" class="kirjelduse-pilt">

    <map name="arvutipilt">
        <!-- Monitor -->
        <area shape="rect" coords="335,178,542,342" href="monitor.html" alt="Monitor" title="Monitor">

        <!-- Klaviatuur -->
        <area shape="rect" coords="185,395,318,438" href="klaviatuur.html" alt="Klaviatuur" title="Klaviatuur">

        <!-- Hiir -->
        <area shape="circle" coords="328,426,30" href="hiir.html" alt="Hiir" title="Hiir">

        <!-- Tass -->
        <area shape="rect" coords="173,310,217,378" href="tass.html" alt="Tass" title="Tass">

        <!-- Markmik -->
        <area shape="poly" coords="390,466,540,450,600,540,430,555" href="markmik.html" alt="Märkmik" title="Märkmik">

        <!-- Kolar -->
        <area shape="rect" coords="233,234,326,334" href="kolar.html" alt="Kõlar" title="Kõlar">
    </map>

    <section class="kirjeldus-kast">
        <h2>Vali pildilt mõni ala!</h2>
        <p>Klõpsa pildil olevale esemele, et lugeda selle kohta lähemalt. Rect: Monitor, Klaviatuur Circle: Hiir, Tass Poly: Märkmik, Kõlar
            -----Vabandust, mul on paigutus natuke viltu----
        </p>
    </section>
</main>

<footer>
    <p><a href="index.html">Tagasi minu kodulehele</a></p>
</footer>






<script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
<script>
    imageMapResize();
</script>

</body>
</html>
