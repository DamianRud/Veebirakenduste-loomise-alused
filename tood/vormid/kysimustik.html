<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="vormstyle.css">
    <script src="../js/kysimustikScript.js"></script>
</head>

<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>

<form action="#">
    <!-- c+ tab komentaar -->
    <!-- tekstkast -->

    <table border="1">
        <tr>
            <td>
                <label for="nimi">Vali meeldivaim muusikastist:</label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Nimi" oninput="nimilugeminekastist()">
            </td>


            <td>
                <div id="vastus1"></div>
            </td>
        </tr>


        <tr>
            <td>
                <label>
                    kuidas sa muusikat peamiselt kuulad?
                </label>
            </td>
            <td>
                <select name="stiil" id="stiil" onchange="selectValik()">
                    <option value="vali">vali..</option>
                    <option value="hiphop">hiphop</option>
                    <option value="kantri">kantri</option>
                    <option value="rock">rock</option>
                    <option value="metal">metal</option>
                </select>

                <div id="vastus5"></div>
            </td>
        </tr>

        <!-- radio nupud - üks valik mitmest -->

        <tr>
            <td>
                <label>Platvorm:</label>
            </td>
            <td>
                <input type="radio" name="platvorm" id="spotify" value="spotify" onclick="radioValik()">
                <label for="spotify">spotify</label>
                <br>

                <input type="radio" name="platvorm" id="raadio" value="raadio" onclick="radioValik()">
                <label for="raadio">raadio</label>
                <br>

                <input type="radio" name="platvorm" id="vinyl" value="vinüülplaat" onclick="radioValik()">
                <label for="vinyl">vinüülplaat</label>

            <td>
                <div id="vastus2"></div>
            </td>
        </tr>

        <!-- checkbox -->

        <tr>
            <td>
                <label>Lemmik ansambel:</label>
            </td>
            <td>
                <fieldset>
                    <legend>
                        Tee oma valikud - lemmik ansambel
                    </legend>

                    <input type="checkbox" name="lemmikud" id="rollingstones" value="rollingstones" onchange="checkboxValik()">
                    <label for="rollingstones">Rolling stones</label>
                    <br>

                    <input type="checkbox" name="lemmikud" id="systemofdown" value="system of down" onchange="checkboxValik()">
                    <label for="systemofdown">System of Down</label>
                    <br>

                    <input type="checkbox" name="lemmikud" id="metallica" value="metallica" onchange="checkboxValik()">
                    <label for="metallica">metallica</label>
                </fieldset>
            </td>


            <td>
                <div id="vastus3"></div>
            </td>
        </tr>

        <!-- range - vahemik -->

        <tr>
            <td>
                <label for="tund">
                    Mitu tundi päevas sa kuulad muusikat
                </label>
            </td>
            <td>
                0
                <input type="range" id="tund" min="0" max="24" onchange="rangeValik()">
                24
                <div id="vastus4"></div>
            </td>
        </tr>

        <!-- 5 uut input tüüpi -->

        <tr>
            <td>
                <label for="email">Email:</label>
            </td>
            <td>
                <input type="email" id="email" placeholder="Sinu email">
            </td>
        </tr>

        <tr>
            <td>
                <label for="number">Lemmiklaulude arv:</label>
            </td>
            <td>
                <input type="number" id="number" min="0" max="100">
            </td>
        </tr>

        <tr>
            <td>
                <label for="date">Kuupäev:</label>
            </td>
            <td>
                <input type="date" id="date">
            </td>
        </tr>

        <tr>
            <td>
                <label for="color">Vali värv:</label>
            </td>
            <td>
                <input type="color" id="color">
            </td>
        </tr>

        <tr>
            <td>
                <label for="password">Parool:</label>
            </td>
            <td>
                <input type="password" id="password" placeholder="Parool">
            </td>
        </tr>

        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()">
            </td>

            <td>
                <input type="button" value="Näita/Loe andmed" onclick="naitaKoike()">
            </td>

        <td>
            <div id="vastusKoik"></div>
        </td>


    </table>
</form>

</body>
</html>
