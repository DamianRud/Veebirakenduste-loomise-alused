<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kalkulaatorid</title>
    <link rel="stylesheet" href="kalkStyle.css">
    <script src="../js/kalkScript.js"></script>
    <script src="../js/kalk2Script.js"></script>
    <script src="../js/kalk3Script.js"></script>

</head>
<body>

<h1>Kalkulaatorid</h1>
<section id="yld">
    <!-- css paigatus flex row -->
    <section id="kalk1">
        <h2>Meetri/tolli kalkulaaator</h2>
        <label for="arv">Sisesta arv</label>
        <input type="number" id="arv" min="1" max="100" step="1" value="10" onchange="teisandamine()">
        <br>
        <input type="radio" name="valik" id="meeter" value="meeter" onchange="teisandamine()">
        <label for="meeter">Meeter</label>
        <br>
        <input type="radio" name="valik" id="tolli" value="tolli" onchange="teisandamine()">
        <label for="tolli">Toll</label>
        <br>
        <div id="vastus"></div>
        <img src="" alt="pilt" id="vastusepilt">

    </section>
    <section id="kalk2">
        <h2>joogi kalkulaator</h2>
        <label for="kogus">Mitu tk soovid:</label>
        <input type="number" id="kogus" min="1" max="10" step="1" value="1" onchange="teisandamine()">
        <br>
        <label for="joogiValik">Vali  lemmikjook:</label>
        <select name="joogiValik" id="joogiValik" onchange="jookideValik()">
            <option value="">vali</option>
            <option value="kohv">kohv</option>
            <option value="vesi">vesi</option>
            <option value="Coca">Coca-Cola</option>
            <option value="Fanta">Fanta</option>
        </select>
        <div id="vastus2"></div>
        <img src="" alt="pilt" id="joogipilt">
    </section>

    <section id="kalk3">
    <h2>Kino kalkulaator</h2>
    <label for="piletiKogus">Mitu piletit:</label>
    <input type="number" id="piletiKogus" min="1" max="10" step="1" value="1" onchange="kinoHind()">
    <br>
    <input type="radio" name="pilet" id="taiskasvanu" value="taiskasvanu" onchange="kinoHind()">
    <label for="taiskasvanu">Täiskasvanu</label>
    <br>
    <input type="radio" name="pilet" id="laps" value="laps" onchange="kinoHind()">
    <label for="laps">Laps</label>
    <br>
    <div id="vastus3"></div>
    <img src="" alt="pilt" id="vastusepilt3">
</section>
</section>

</body>
</html>
