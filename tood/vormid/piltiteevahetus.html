<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Piltide vahetus JS abil</title>
    <link rel="stylesheet" href="piltStyle.css">
    <script src="../js/piltScript.js"></script>
</head>
<body onload="juhuslikpilt()">

<!--Paint: 4 pilti: smile.png, neutral.png kurb.png, lill.png
300x300
-->

<h1>Juhuslik pilt</h1>
<img src="../pildid/lill.png" alt="" id="randomPilt">
<input type="button" onclick="juhuslikpilt()" value="vaheta pilt">


<h2>Mõistatus. Arva ära mida näed pildil</h2>

<label for="valik">Tee oma valik:</label>

<select name="valik" id="valik" onchange="selectValik()">

    <option value="vali...">vali</option>
    <option value="../pildid/smail.png">smile</option>
    <option value="../pildid/kurb.png">kurb</option>
    <option value="../pildid/neutral.png">neutral</option>
    <option value="../pildid/lill.png">lill</option>

</select>

<div id="vastus">Siia tuleb vastus</div>



<br>

<input type="radio" name="piltValik" id="v1" value="../pildid/neutral.png" onchange="radioValik()">
<label for="v1">Neutral pilt</label>
<br>

<input type="radio" name="piltValik" id="v2" value="../pildid/lill.png" onchange="radioValik()">
<label for="v2">lill pilt</label>
<br>

<input type="radio" name="piltValik" id="v3" value="../pildid/smail.png" onchange="radioValik()">
<label for="v3">smail pilt</label>
<br>

<input type="radio" name="piltValik" id="v4" value="../pildid/kurb.png" onchange="radioValik()">
<label for="v4">kurb pilt</label>
<br>



</body>
</html>
